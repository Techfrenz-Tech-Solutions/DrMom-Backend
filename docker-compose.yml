services:
  db:
    image: postgres:16-alpine
    container_name: drmom-backend-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: drmombackend
      POSTGRES_USER: drmom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - drmom_backend_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drmom -d drmombackend"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    image: drmom-backend:1
    container_name: drmom-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://drmom:${POSTGRES_PASSWORD}@db:5432/drmombackend?schema=public
      FRONTEND_URL: ${FRONTEND_URL}
      ADMIN_FRONTEND_URL: ${ADMIN_FRONTEND_URL}
      CORS_ORIGIN: ${CORS_ORIGIN}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DEFAULT_ADMIN_NAME: ${DEFAULT_ADMIN_NAME:-Admin User}
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      BUNNY_STREAM_LIBRARY_ID: ${BUNNY_STREAM_LIBRARY_ID:-}
      BUNNY_STREAM_CDN_HOST: ${BUNNY_STREAM_CDN_HOST:-iframe.mediadelivery.net}
      BUNNY_STREAM_PULL_ZONE: ${BUNNY_STREAM_PULL_ZONE:-}
      BUNNY_TOKEN_AUTH_KEY: ${BUNNY_TOKEN_AUTH_KEY:-}
      BUNNY_API_KEY: ${BUNNY_API_KEY:-}
      COURSE_ACCESS_DAYS: ${COURSE_ACCESS_DAYS:-0}
    ports:
      - "28100:4000"

volumes:
  drmom_backend_postgres:
